<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="false">☀ Claro</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-newrecord" class="new-record hidden">¡Nuevo récord!</p>
        <div id="name-form" class="name-form hidden">
          <input type="text" id="name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="save-score-btn" type="button" class="btn-primary">Guardar</button>
        </div>
        <div id="overlay-records" class="records hidden">
          <table class="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Score</th>
                <th>Líneas</th>
                <th>Nivel</th>
              </tr>
            </thead>
            <tbody id="overlay-records-body"></tbody>
          </table>
        </div>
        <button id="restart-btn" class="btn-primary">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div class="records">
          <table class="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Score</th>
                <th>Líneas</th>
                <th>Nivel</th>
              </tr>
            </thead>
            <tbody id="start-records-body"></tbody>
          </table>
        </div>
        <p id="start-best-combo" class="records-stat"></p>
        <p id="start-max-lines" class="records-stat"></p>
        <button id="play-btn" type="button" class="btn-primary">Jugar</button>
        <button id="clear-records-btn" type="button" class="secondary-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
